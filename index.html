<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asif AI Ads — Video Ads & Reels Editing, Karachi</title>
<meta name="description" content="Facebook, TikTok & Instagram video ads, reels editing, AI video ads and Urdu/English captions. Karachi.">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#eef0f4;line-height:1.5}
a{color:inherit}.w{max-width:960px;margin:0 auto;padding:0 18px}
header{padding:56px 0 40px;background:linear-gradient(160deg,#1d2b64,#7b2ff7 60%,#f107a3)}
h1{font-size:2.1rem;margin:0 0 8px}h2{font-size:1.5rem;margin:0 0 16px}.ur{font-size:1.25rem;direction:rtl;font-family:'Noto Nastaliq Urdu',serif;opacity:.95}
.btn{display:inline-block;padding:13px 20px;border-radius:12px;font-weight:700;text-decoration:none;margin:6px 8px 0 0}
.wa{background:#25d366;color:#062}.alt{background:#fff;color:#222}
section{padding:40px 0;border-bottom:1px solid #222}.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.c{background:#181b22;border-radius:14px;padding:18px}.c h3{margin:0 0 6px}.p{color:#ffcc4d;font-size:.9rem;font-weight:600}
ol{padding-left:20px}ol li{margin:8px 0}.s img{width:100%;border-radius:12px;display:block}.s p{margin:8px 0 0;color:#aab}
footer{padding:24px 0;color:#889;font-size:.9rem}
</style></head><body>
<header><div class="w"><h1 id="brand">Asif AI Ads</h1><p id="tag"></p><p class="ur" id="urdu"></p>
<a class="btn wa wal" href="https://wa.me/923172487750" target="_blank" rel="noopener">Chat on WhatsApp</a><a class="btn alt" href="#work">See sample work</a></div></header>
<main><section><div class="w"><h2>Services</h2><div class="g" id="services"></div></div></section>
<section><div class="w"><h2>How it works</h2><ol id="steps"></ol></div></section>
<section id="work" class="s"><div class="w"><h2>Sample work</h2><div class="g" id="samples"></div></div></section>
<section id="contact"><div class="w"><h2>Contact</h2><p id="ct"></p><a class="btn wa wal" href="https://wa.me/923172487750" target="_blank" rel="noopener">Chat on WhatsApp</a></div></section></main>
<footer><div class="w" id="ft"></div></footer>
<script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('content.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
const $=i=>document.getElementById(i),c=d.contact||{};
document.title=d.brand+' — Video Ads & Reels, Karachi';$('brand').textContent=d.brand;$('tag').textContent=d.tagline;$('urdu').textContent=d.urdu;
$('services').innerHTML=(d.services||[]).map(x=>`<div class="c"><h3>${E(x.title)}</h3><p>${E(x.text)}</p><p class="p">${E(x.price)}</p></div>`).join('');
$('steps').innerHTML=(d.steps||[]).map(x=>`<li>${E(x)}</li>`).join('');
$('samples').innerHTML=(d.samples||[]).map(x=>`<div><img src="${E(x.image)}" alt="${E(x.caption)}" loading="lazy"><p>${E(x.caption)}</p></div>`).join('');
const wa='https://wa.me/'+encodeURIComponent(c.whatsapp);document.querySelectorAll('.wal').forEach(a=>{a.href=wa;a.target='_blank';a.rel='noopener';});
$('ct').innerHTML=`${c.name?`<strong>${E(c.name)}</strong><br>`:''}WhatsApp / Phone: <a href="tel:+${E(c.whatsapp)}">${E(c.phone)}</a><br>Email: <a href="mailto:${E(c.email)}">${E(c.email)}</a><br>Freelancer: <a href="${E(c.freelancer)}" target="_blank" rel="noopener">${E(c.freelancer)}</a><br>Location: ${E(c.location)}`;
$('ft').textContent='\u00a9 2026 '+d.brand;});
</script>
</body></html>
